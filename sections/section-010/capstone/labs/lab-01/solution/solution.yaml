apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: backstage
data:
  app-config.lab.yaml: |
    app:
      title: Starfleet Developer Portal
      baseUrl: http://localhost:7007
    organization:
      name: Starfleet
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      cors:
        origin: http://localhost:7007
      database:
        client: better-sqlite3
        connection: ':memory:'
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-responsibilities
  namespace: backstage
data:
  owner: platform-team
  database: PostgreSQL in production, because SQLite in memory loses all data at a restart
  identity: sign-in provider and permission policy chosen and operated by the platform team
  release: "1.55.2"
