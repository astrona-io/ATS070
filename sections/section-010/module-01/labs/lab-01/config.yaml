# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Configure And Own The Portal (LAB). Graded against the live cluster.
# Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-070-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/backstage/backstage:1.55.2
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the Backstage Deployment with a generic title, no catalog rules and no owner
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until one ready pod is left
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: title-configured
      description: app.title in the ConfigMap is Starfleet Developer Portal
      type: file
      source: validation/validate-title-configured.sh
      hint: Edit the key app-config.lab.yaml in the ConfigMap backstage-app-config and change only the title line under app.
    - name: catalog-rules
      description: catalog.rules allows Component, System, API, Resource and Location, and not Template
      type: file
      source: validation/validate-catalog-rules.sh
      hint: "Add a catalog block with rules and one line - allow: [Component, System, API, Resource, Location]"
    - name: owner-annotation
      description: The Deployment has the annotation portal.starfleet.example/owner with the value platform-team
      type: file
      source: validation/validate-owner-annotation.sh
      hint: Use kubectl annotate on the Deployment, not on the pod.
    - name: running-pod-uses-config
      description: The Deployment was restarted and the ready pod mounts the new title
      type: file
      source: validation/validate-running-pod-uses-config.sh
      hint: The backend reads configuration at start. Run kubectl rollout restart and wait for the rollout to finish.
    - name: portal-answers
      description: The readiness endpoint answers 200 through the Service
      type: file
      source: validation/validate-portal-answers.sh
      hint: If the endpoint does not answer, read the pod log; a configuration mistake stops the backend.

teardown:
  keepCluster: false
