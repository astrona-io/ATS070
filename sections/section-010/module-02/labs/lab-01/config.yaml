# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Map The Application And Add A Configuration Layer (LAB). Graded against the
# live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-070-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/backstage/backstage:1.55.2
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the standard Backstage Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until one ready pod is left
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: entry-command
      description: anatomy-record names the real start command of the backend
      type: file
      source: validation/validate-entry-command.sh
      hint: Read the command field of the container in the Deployment. Write it as one line with a space between the words.
    - name: backend-plugins
      description: anatomy-record lists at least three backend plugin packages that exist in the pod
      type: file
      source: validation/validate-backend-plugins.sh
      hint: List /app/node_modules/@backstage inside the pod and keep names of the form plugin-<id>-backend, one per line, without the scope.
    - name: release
      description: anatomy-record has the release tag of the image
      type: file
      source: validation/validate-release.sh
      hint: The release is the part of the image after the colon.
    - name: extra-config-layer
      description: A second file is the last --config argument and the first file is kept
      type: file
      source: validation/validate-extra-config-layer.sh
      hint: Add the arguments --config and the new path at the end of the args list. Keep the existing ones.
    - name: running-pod-reads-extra
      description: The ready pod mounts the extra file, keeps its image and answers on the readiness endpoint
      type: file
      source: validation/validate-running-pod-reads-extra.sh
      hint: Mount the new ConfigMap at /etc/backstage-extra with its own volume, and wait for the rollout to finish.

teardown:
  keepCluster: false
