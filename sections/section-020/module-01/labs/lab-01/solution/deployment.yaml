apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/backstage/backstage:1.55.2
          command: ["node", "packages/backend"]
          args:
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "/etc/backstage/app-config.lab.yaml"
            - "--config"
            - "/etc/backstage-production/app-config.production.yaml"
          env:
            - name: APP_CONFIG_organization_name
              value: "Starfleet Command"
          ports:
            - name: http
              containerPort: 7007
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: app-config
              mountPath: /etc/backstage
              readOnly: true
            - name: app-config-production
              mountPath: /etc/backstage-production
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: backstage-app-config
        - name: app-config-production
          configMap:
            name: backstage-app-config-production
