# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Layer A Production Configuration File And An Override (LAB). Graded against
# the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-070-lab-020-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/backstage/backstage:1.55.2
      - curlimages/curl:8.22.0

# Starting state: Backstage with one mounted file (backstage-app-config).
bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespace, the ConfigMap, the Deployment and the Service for Backstage
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the old pod is gone
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: production-configmap
      description: The ConfigMap backstage-app-config-production sets the title and a two-item methods list
      type: file
      source: validation/validate-production-configmap.sh
      hint: Create the ConfigMap in the namespace backstage with the key app-config.production.yaml. Write app.title and backend.cors.methods in the YAML text of that key.
    - name: config-order
      description: The production file is loaded with --config after the existing flags
      type: file
      source: validation/validate-config-order.sh
      hint: Add the volume, the volume mount at /etc/backstage-production and two more args, --config and the file path, at the end of the args list. The last flag wins.
    - name: env-override
      description: APP_CONFIG_organization_name is set to Starfleet Command on the container
      type: file
      source: validation/validate-env-override.sh
      hint: Add the variable to the env list of the container. The variable name is APP_CONFIG_organization_name.
    - name: running-pod-has-changes
      description: The running pod has the production file and the variable
      type: file
      source: validation/validate-running-pod.sh
      hint: Changing the pod template starts a new pod. Wait for the rollout to finish before you submit.
    - name: backstage-available
      description: Backstage is available with its original image and the original two flags
      type: file
      source: validation/validate-backstage-available.sh
      hint: Add to the existing Deployment. Do not replace the image or remove the first two --config flags.

teardown:
  keepCluster: false
