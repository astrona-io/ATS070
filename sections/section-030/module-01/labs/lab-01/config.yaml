# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Move Backstage From SQLite To PostgreSQL (LAB). Starting state: Backstage with an in-memory SQLite database, and a PostgreSQL Deployment with a claim and a Secret. Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-070-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/backstage/backstage:1.55.2
      - curlimages/curl:8.22.0
      - postgres:16-alpine

bootstrap:
  init:
    - name: seed-cluster
      description: Create the namespace, Backstage (SQLite in memory) and PostgreSQL with its Secret and claim
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until the rollout has finished
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: db-config-uses-pg
      description: The ConfigMap selects PostgreSQL and reads the connection from POSTGRES_ substitutions
      type: file
      source: validation/validate-db-config-uses-pg.sh
      hint: In backend.database set client to pg and give connection the keys host, port, user and password with the values ${POSTGRES_HOST}, ${POSTGRES_PORT}, ${POSTGRES_USER} and ${POSTGRES_PASSWORD}. Remove the better-sqlite3 lines.
    - name: password-not-plain
      description: The database password is in neither the ConfigMap nor the Deployment
      type: file
      source: validation/validate-password-not-plain.sh
      hint: Do not type the password anywhere. The Secret postgres-secrets already holds it.
    - name: db-env-from-secret
      description: Backstage reads credentials from postgres-secrets and sets host and port
      type: file
      source: validation/validate-db-env-from-secret.sh
      hint: Add envFrom with secretRef postgres-secrets, and the variables POSTGRES_HOST (the Service name postgres) and POSTGRES_PORT (5432) to the backstage container.
    - name: postgres-persistent
      description: PostgreSQL keeps its data on the claim postgres-data
      type: file
      source: validation/validate-postgres-persistent.sh
      hint: Do not change the postgres Deployment or its claim.
    - name: backstage-db-available
      description: A ready Backstage pod runs with the PostgreSQL variables
      type: file
      source: validation/validate-backstage-db-available.sh
      hint: Changing the Deployment starts a new pod. Wait until it is ready; a ConfigMap change alone does not restart the running pod.

teardown:
  keepCluster: false
