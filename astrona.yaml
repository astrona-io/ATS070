# Course manifest for ATS070. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS070
  title: 'CBA: Backstage Infrastructure'
  description: Concept lessons, playgrounds, graded labs, capstones and original quizzes
    covering every published objective in the CBA Backstage Infrastructure domain.
    Labs run Backstage on kind (Kubernetes 1.35). Built untested; technical content
    remains draft.
  certification:
    name: Certified Backstage Associate
    code: CBA
    provider: CNCF / Linux Foundation
    domain: Backstage Infrastructure
    weight: 22
    competencies:
    - Understand the Backstage framework
    - Configure Backstage
    - Deploy Backstage to production
    - Understand Backstage client-server architecture
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: Understand the Backstage framework
  description: 'Makes the reader able to describe Backstage as a framework that an
    organization assembles into its own portal, to name its features and the duties
    of the adopting organization, and to read the anatomy of an application: project
    packages, backend plugins, modules, extension points and services, frontend extensions,
    and version rules.

'
